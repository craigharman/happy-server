version: "3.8"

services:
    happy-server:
        build: .
        ports:
            - "3000:3000"
        environment:
            - NODE_ENV=production
            - DATABASE_URL=${DATABASE_URL}
            - REDIS_URL=redis://redis:6379
            - SEED=${SEED:-change-me-to-a-random-secret}
            - PORT=3000
        depends_on:
            - redis
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data

volumes:
    redis_data:
