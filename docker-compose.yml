version: "3.8"

services:
    happy-server:
        build: .
        ports:
            - "3000:3000"
        environment:
            - NODE_ENV=production
            - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-happy-server}
            - REDIS_URL=redis://redis:6379
            - SEED=${SEED:-change-me-to-a-random-secret}
            - PORT=3000
        depends_on:
            - postgres
            - redis
        restart: unless-stopped

    postgres:
        image: postgres:15
        environment:
            - POSTGRES_DB=${POSTGRES_DB:-happy-server}
            - POSTGRES_USER=${POSTGRES_USER:-postgres}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data

volumes:
    postgres_data:
    redis_data:
